# Legacy publishing fallback retained by migration policy. Tags do not trigger it.
# This path bypasses unified signing and notarization; use only with explicit approval.
name: Release (legacy manual fallback)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example, v0.3.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Stash GoReleaser config
        run: cp .goreleaser.yaml /tmp/.goreleaser.yaml

      - name: Checkout release tag
        run: git checkout ${{ inputs.tag }}

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --config /tmp/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - name: Resolve release metadata
        run: |
          release_tag="${{ inputs.tag }}"
          release_version="${release_tag#v}"
          {
            echo "RELEASE_TAG=${release_tag}"
            echo "RELEASE_VERSION=${release_version}"
            echo "MACOS_ARTIFACT=sonoscli_${release_version}_macos-universal.tar.gz"
          } >> "${GITHUB_ENV}"

      - name: Dispatch tap formula update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN with workflow dispatch access to steipete/homebrew-tap"
            exit 1
          fi

          request_id="sonoscli-${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected_title="Update sonoscli for ${RELEASE_TAG} (${request_id})"

          gh workflow run update-formula.yml \
            --repo steipete/homebrew-tap \
            --ref main \
            -f formula=sonoscli \
            -f tag="${RELEASE_TAG}" \
            -f repository=steipete/sonoscli \
            -f macos_artifact="${MACOS_ARTIFACT}" \
            -f request_id="${request_id}"

          run_id=""
          for _ in {1..30}; do
            run_id=$(gh run list \
              --repo steipete/homebrew-tap \
              --workflow update-formula.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"${expected_title}\") | .databaseId" | head -n1)
            if [ -n "${run_id}" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "${run_id}" ]; then
            echo "::error::Could not find tap workflow run with title: ${expected_title}"
            exit 1
          fi

          gh run watch "${run_id}" \
            --repo steipete/homebrew-tap \
            --exit-status \
            --interval 60
